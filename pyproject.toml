[project]
name = "onec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx", "tomli", "python-dotenv"]

[project.scripts]
onec-mcp = "onec.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onec"]

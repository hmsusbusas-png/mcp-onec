[project]
name = "mcp-onec"
version = "1.0.0"
description = "Read only MCP server for 1C:Enterprise through the standard OData interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
mcp-onec = "onec.main:run"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs installed desktop software, a real server or internet"]
addopts = "-m 'not live'"
